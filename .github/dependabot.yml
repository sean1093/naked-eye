version: 2

updates:
  # Development tooling is grouped, so a week of minor and patch bumps becomes
  # one review. Runtime dependencies are not: they parse attacker-controlled
  # input, so each of their updates is reviewed and revertable on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors stay ungrouped on purpose: a toolchain major usually needs a
    # config migration, and it should be reviewable and revertable alone.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
